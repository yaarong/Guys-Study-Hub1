<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Learning | סיכומים</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css"> 
</head>
<body>
    <div class="container my-5">
        <header class="mb-5">
            <a href="../index.html" class="btn btn-outline-secondary float-start">Back</a>
            <h1 class="text-center">🤖 Machine Learning</h1>
            <p class="lead text-center">upervised & Unsupervised Learning, Neural Networks, and Modern Deep Learning Architectures</p>
        </header>

        <section id="summaries-list" class="mt-4">
            <h2 class="mb-3">Summaries</h2>
            <ul id="summaries-container" class="list-group shadow-sm"></ul>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const courseName = "machine-learning"; 
        const container = document.getElementById('summaries-container');

        async function loadSummaries() {
            try {
                const response = await fetch(`../data/${courseName}.json`); 
                if (!response.ok) throw new Error('File not found');
                const summaries = await response.json();

                summaries.forEach(summary => {
                    const listItem = document.createElement('li');
                    listItem.className = 'list-group-item d-flex justify-content-between align-items-center';
                    const pdfPath = `../pdfs/${courseName}/${summary.filename}`;
                    
                    listItem.innerHTML = `
                        <span>${summary.id}. ${summary.title}</span>
                        <a href="${pdfPath}" target="_blank" class="btn btn-sm btn-primary">צפייה בסיכום (PDF)</a>
                    `;
                    container.appendChild(listItem);
                });
            } catch (error) {
                container.innerHTML = `<li class="list-group-item list-group-item-danger">שגיאה בטעינת הקבצים</li>`;
            }
        }
        loadSummaries();
    </script>
</body>
</html>
